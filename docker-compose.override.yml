version: '3.4'

services:
  
  catalogdb:
    container_name: catalogdb
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=CatalogDb
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - catalogdbdata:/var/lib/postgresql/data/

  basketdb:
    container_name: basketdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=BasketDb
    restart: always
    ports:
      - "5434:5432"
    volumes:
      - posgres_basket:/var/lib/postgresql/data/



  catalog.api:
    container_name: catalog.api
    build:
      context: .
      dockerfile: src/Catalog.API/Dockerfile

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Host=ep-patient-bonus-axon3ruv-pooler.c-4.us-east-2.aws.neon.tech;Port=5432;Database=neondb;Username=neondb_owner;Password=npg_lSdcbCDV5H7u;SSL Mode=Require;Channel Binding=Require
    ports:
      - "8080:8080"
    depends_on:
      - catalogdb

  redis:
    container_name: redis
    image: redis:7.4
    restart: always
    ports:
      - "6379:6379"

  basket.api:
    container_name: basket.api
    build:
      context: .
      dockerfile: src/Basket/Basket.API/Dockerfile

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Host=ep-patient-bonus-axon3ruv-pooler.c-4.us-east-2.aws.neon.tech;Port=5432;Database=neondb;Username=neondb_owner;Password=npg_lSdcbCDV5H7u;SSL Mode=Require;Channel Binding=Require
      - ConnectionStrings__Redis=marigoldish-applicable-nuanced-87366.db.redis.io:11558,user=default,password=CiDIohGkrfBqe7Fy2UXixI48gdSRHllX,abortConnect=false
    ports:
      - "8082:8080"
    depends_on:
      - basketdb
      - redis